name: Feature request / 功能建议
description: Suggest an idea / 提出新想法
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome — they'll be triaged against the roadmap in the README.
        Ideas that expand scope significantly will be recorded and scheduled, not implemented immediately.
        想法都会被记录并对照路线图评估；大范围扩展会排期而不会立即实现。
  - type: textarea
    id: problem
    attributes:
      label: Problem / 要解决的问题
      description: "What can't you do today? Which scenario? 现在做不到什么？什么场景？"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution / 期望的方案
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Does this affect metric semantics? / 是否影响指标口径？
      description: Changes to what a number means need a docs/metrics.md update and a version bump.
      options:
        - "No / 不影响"
        - "Yes / 影响"
        - "Not sure / 不确定"
    validations:
      required: true
