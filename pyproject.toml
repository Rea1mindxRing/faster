[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "faster"
version = "0.1.0"
description = "Unified-metric LLM inference benchmark SDK - comparable results across engines and cloud providers"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "faster contributors" }]
keywords = ["llm", "benchmark", "performance", "ttft", "tpot", "throughput", "inference"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
cli = [
    "typer>=0.12",
    "rich>=13.7",
    "psutil>=5.9",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-psutil>=6",
]

[project.scripts]
faster = "faster.cli:main"

[project.urls]
Homepage = "https://github.com/faster-llm/faster"
Documentation = "https://github.com/faster-llm/faster/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/faster"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/faster"]
